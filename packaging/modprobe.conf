# Surface Laptop Ultra cameras
# boot the CCU firmware (nvCCU.img from the Windows driver store) when ROT0 probes
options surface_ccu_boot go=1
# the sensor is driven by surface_ultra_cam; the stock driver only fights over its GPIOs
blacklist ov02c10
# webcam endpoints fed by sucamd (front) and sucamd --ir (IR)
options v4l2loopback devices=2 exclusive_caps=1,1 card_label="Surface Camera,Surface IR Camera"
